# TRIGGER: 6 rates + SAE-H2E selector -> Supported Rates (IE 1) = 98 24 B0 48 60 6C FB
# Expected on affected Android: getWifiStandard() == WIFI_STANDARD_UNKNOWN (should be 11ax)
# 5 GHz is used because 6 GHz is no-IR on this host; the AOSP bug is band-independent.
interface=@IFACE@
driver=nl80211
ctrl_interface=@CTRL@
logger_stdout=-1
logger_stdout_level=2

country_code=US
ieee80211d=1
hw_mode=a
channel=36
beacon_int=100

ieee80211n=1
ieee80211ac=1
ieee80211ax=1
wmm_enabled=1
vht_oper_chwidth=0
he_oper_chwidth=0

ssid=repro-h2e-ie1
wpa=2
wpa_key_mgmt=SAE
rsn_pairwise=CCMP
ieee80211w=2
sae_pwe=1
sae_password=repro-test-passphrase

# 100 kbps units: 12 18 24 36 48 54 Mb/s, basic 12 and 24
supported_rates=120 180 240 360 480 540
basic_rates=120 240
