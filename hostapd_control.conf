# CONTROL: 8 rates fill IE 1, so the SAE-H2E selector moves to Extended Supported Rates
# IE 1 = 8C 12 98 24 B0 48 60 6C, IE 50 = FB
# Expected on affected Android: getWifiStandard() == WIFI_STANDARD_11AX
interface=@IFACE@
driver=nl80211
ctrl_interface=@CTRL@
logger_stdout=-1
logger_stdout_level=2

country_code=US
ieee80211d=1
hw_mode=a
channel=36
beacon_int=100

ieee80211n=1
ieee80211ac=1
ieee80211ax=1
wmm_enabled=1
vht_oper_chwidth=0
he_oper_chwidth=0

ssid=repro-h2e-ie50
wpa=2
wpa_key_mgmt=SAE
rsn_pairwise=CCMP
ieee80211w=2
sae_pwe=1
sae_password=repro-test-passphrase

# 100 kbps units: all 8 OFDM rates, basic 6, 12 and 24
supported_rates=60 90 120 180 240 360 480 540
basic_rates=60 120 240
